<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kids Cash Register</title>
  <style>
    :root {
      --bg-grad: linear-gradient(135deg, #ffe6f2 0%, #f3e8ff 100%);
      --machine-bg: #fff5f9;
      --machine-border: #ff66b3;
      --machine-shadow: #d9368b;
      --header-bg: #ff85c0;
      --select-text: #c41d7f;
      --select-border: #eb2f96;
      --drawer-bg: #fffbe6;
      --drawer-border: #ffc53d;
      --drawer-inner: #fff1b8;
      --text-main: #531dab;
      --set-btn: #722ed1;
      --set-shadow: #391085;
      --house-grad: linear-gradient(180deg, #36cfc9 0%, #08979c 100%);
      --house-shadow: #00474f;
    }

    body.theme-blue {
      --bg-grad: linear-gradient(135deg, #e6f7ff 0%, #e6fffb 100%);
      --machine-bg: #f0f9ff;
      --machine-border: #36cfc9;
      --machine-shadow: #08979c;
      --header-bg: #40a9ff;
      --select-text: #0050b3;
      --select-border: #096dd9;
      --drawer-bg: #f6ffed;
      --drawer-border: #73d13d;
      --drawer-inner: #d9f7be;
      --text-main: #003a8c;
      --set-btn: #389e0d;
      --set-shadow: #135200;
      --house-grad: linear-gradient(180deg, #597ef7 0%, #1d39c4 100%);
      --house-shadow: #061178;
    }

    body.theme-orange {
      --bg-grad: linear-gradient(135deg, #fff7e6 0%, #fff1b8 100%);
      --machine-bg: #fffbe6;
      --machine-border: #ffa940;
      --machine-shadow: #d46b08;
      --header-bg: #fa8c16;
      --select-text: #ad4e00;
      --select-border: #d46b08;
      --drawer-bg: #f6ffed;
      --drawer-border: #95de64;
      --drawer-inner: #d9f7be;
      --text-main: #873800;
      --set-btn: #d4380d;
      --set-shadow: #871400;
      --house-grad: linear-gradient(180deg, #36cfc9 0%, #08979c 100%);
      --house-shadow: #00474f;
    }

    * {
      box-sizing: border-box;
      font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-grad);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 20px 14px;
    }

    .register-body {
      width: 100%;
      max-width: 620px;
      background: var(--machine-bg);
      border: 6px solid var(--machine-border);
      border-radius: 30px;
      padding: 20px;
      box-shadow: 0 12px 0 var(--machine-shadow);
    }

    .top-header {
      background: var(--header-bg);
      padding: 14px;
      border-radius: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .profile-wrap {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    select {
      font-size: 1.25rem;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 14px;
      border: 4px solid var(--select-border);
      background: #ffffff;
      color: var(--select-text);
      cursor: pointer;
    }

    .mini-btn {
      font-size: 0.95rem;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 12px;
      border: 2px solid #ffffff;
      background: rgba(0, 0, 0, 0.25);
      color: #ffffff;
      cursor: pointer;
    }

    .account-editor {
      display: none;
      background: #ffffff;
      border: 4px solid var(--machine-border);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .account-editor.open {
      display: block;
    }

    .editor-title {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .editor-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .editor-row input[type="text"] {
      flex: 1;
      min-width: 140px;
      font-size: 1.1rem;
      padding: 8px 12px;
      border-radius: 12px;
      border: 3px solid #d9d9d9;
    }

    .theme-pill {
      padding: 8px 12px;
      border-radius: 12px;
      border: 3px solid transparent;
      font-weight: bold;
      color: #ffffff;
      cursor: pointer;
      opacity: 0.7;
    }

    .theme-pill.selected {
      opacity: 1;
      border-color: #141414;
    }

    .pill-pink { background: #eb2f96; }
    .pill-blue { background: #1890ff; }
    .pill-orange { background: #fa8c16; }

    .led-screen {
      background: #141414;
      border: 4px solid #434343;
      border-radius: 16px;
      padding: 6px 16px;
      text-align: right;
    }

    .led-caption {
      font-size: 0.7rem;
      color: #8c8c8c;
      font-family: monospace;
    }

    .led-amount {
      font-family: monospace;
      font-size: 2.1rem;
      font-weight: bold;
      color: #52c41a;
    }

    .money-input-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: #ffffff;
      padding: 10px;
      border-radius: 18px;
      border: 3px solid var(--machine-border);
    }

    input[type="number"] {
      flex: 1;
      font-size: 1.15rem;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 12px;
      border: 3px solid #d9d9d9;
      min-width: 0;
    }

    .action-btn {
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      color: #ffffff;
      cursor: pointer;
    }

    .btn-set { background: var(--set-btn); box-shadow: 0 4px 0 var(--set-shadow); }
    .btn-reset { background: #ff4d4f; box-shadow: 0 4px 0 #a8071a; }
    .btn-cancel { background: #8c8c8c; box-shadow: 0 4px 0 #434343; }

    .store-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .item-btn {
      border: none;
      border-radius: 20px;
      padding: 14px 8px;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 115px;
    }

    .btn-oj { background: linear-gradient(180deg, #ffa940 0%, #fa8c16 100%); box-shadow: 0 6px 0 #ad4e00; }
    .btn-bread { background: linear-gradient(180deg, #ffc53d 0%, #d48806 100%); box-shadow: 0 6px 0 #874d00; }
    .btn-house { background: var(--house-grad); box-shadow: 0 6px 0 var(--house-shadow); }

    .stacked-word { display: block; font-size: 1.35rem; font-weight: bold; line-height: 1.05; }
    .single-word { font-size: 1.4rem; font-weight: bold; }
    .price-pill { margin-top: 6px; background: rgba(255,255,255,0.28); padding: 2px 12px; border-radius: 999px; font-weight: bold; }

    .cash-drawer {
      background: var(--drawer-bg);
      border: 4px solid var(--drawer-border);
      border-radius: 20px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .drawer-header { font-weight: bold; margin-bottom: 10px; }

    .drawer-tray {
      background: var(--drawer-inner);
      border-radius: 14px;
      padding: 12px;
      min-height: 85px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .paper-bill {
      width: 112px;
      height: 54px;
      border-radius: 10px;
      border: 3px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.3rem;
      box-shadow: 0 3px 0 rgba(0,0,0,0.15);
    }

    .bill-100 { background: #b7eb8f; border-color: #237804; color: #135200; }
    .bill-50  { background: #ffd6e7; border-color: #c41d7f; color: #780650; }
    .bill-20  { background: #bae7ff; border-color: #096dd9; color: #003a8c; }
    .bill-10  { background: #ffe7ba; border-color: #d46b08; color: #873800; }
    .bill-5   { background: #efdbff; border-color: #531dab; color: #22075e; }
    .bill-1   { background: #d9f7be; border-color: #389e0d; color: #135200; }

    .receipt-box {
      background: #ffffff;
      border: 4px dashed #bfbfbf;
      border-radius: 18px;
      padding: 14px;
    }

    .receipt-title { font-weight: bold; margin-bottom: 8px; border-bottom: 2px solid #f0f0f0; padding-bottom: 6px; }
    .receipt-list { max-height: 150px; overflow-y: auto; }
    .receipt-row { display: flex; justify-content: space-between; padding: 6px 2px; border-bottom: 1px solid #f0f0f0; }
  </style>
</head>
<body>
  <div class="register-body">
    <div class="top-header">
      <div class="profile-wrap">
        <select id="accountSelect"></select>
        <button type="button" class="mini-btn" id="editBtn">Edit</button>
        <button type="button" class="mini-btn" id="addBtn">+ Add Account</button>
      </div>
      <div class="led-screen">
        <div class="led-caption">BALANCE</div>
        <div class="led-amount" id="balanceDisplay">$25</div>
      </div>
    </div>

    <div class="account-editor" id="accountEditor">
      <div class="editor-title" id="editorTitle">Add New Account</div>
      <div class="editor-row">
        <input type="text" id="accountNameInput" placeholder="Write account name..." maxlength="20" />
        <button type="button" class="theme-pill pill-pink selected" id="themePink">Pink</button>
        <button type="button" class="theme-pill pill-blue" id="themeBlue">Blue</button>
        <button type="button" class="theme-pill pill-orange" id="themeOrange">Orange</button>
        <button type="button" class="action-btn btn-set" id="saveEditorBtn">Save</button>
        <button type="button" class="action-btn btn-cancel" id="cancelEditorBtn">Cancel</button>
      </div>
    </div>

    <div class="money-input-bar">
      <input type="number" id="startCashInput" placeholder="Type starting money..." min="0" />
      <button type="button" class="action-btn btn-set" id="setCashBtn">Set Cash</button>
      <button type="button" class="action-btn btn-reset" id="resetBtn">Reset</button>
    </div>

    <div class="store-buttons">
      <button type="button" class="item-btn btn-oj" id="buyOjBtn">
        <span class="stacked-word">Orange</span>
var accounts = [
{ name: "Sophie", theme: "pink", balance: 25, receipts: [] },
{ name: "Tigran", theme: "blue", balance: 25, receipts: [] }
];
var currentIndex = 0;
var editorMode = "add";
var selectedTheme = "pink";
var audioCtx = null;
function playSound(freq, type, duration) {
try {
if (!audioCtx) {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
if (audioCtx.state === "suspended") {
audioCtx.resume();
}
var osc = audioCtx.createOscillator();
var gain = audioCtx.createGain();
osc.type = type;
osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
osc.connect(gain);
gain.connect(audioCtx.destination);
osc.start();
osc.stop(audioCtx.currentTime + duration);
} catch (err) {}
}
function setTheme(theme) {
selectedTheme = theme;
document.getElementById("themePink").className = "theme-pill pill-pink" + (theme === "pink" ? " selected" : "");
document.getElementById("themeBlue").className = "theme-pill pill-blue" + (theme === "blue" ? " selected" : "");
document.getElementById("themeOrange").className = "theme-pill pill-orange" + (theme === "orange" ? " selected" : "");
}
function openEditor(mode) {
editorMode = mode;
var editor = document.getElementById("accountEditor");
var title = document.getElementById("editorTitle");
var input = document.getElementById("accountNameInput");
if (mode === "edit") {
title.textContent = "Edit Account";
input.value = accounts[currentIndex].name;
setTheme(accounts[currentIndex].theme);
} else {
title.textContent = "Add New Account";
input.value = "";
setTheme("pink");
}
editor.classList.add("open");
playSound(600, "sine", 0.1);
}
function saveEditor() {
var name = document.getElementById("accountNameInput").value.trim();
if (!name) {
alert("Please write an account name!");
return;
}
if (editorMode === "edit") {
accounts[currentIndex].name = name;
accounts[currentIndex].theme = selectedTheme;
} else {
accounts.push({ name: name, theme: selectedTheme, balance: 25, receipts: [] });
currentIndex = accounts.length - 1;
}
document.getElementById("accountEditor").classList.remove("open");
playSound(800, "sine", 0.15);
render();
}
function buyItem(name, price) {
var acc = accounts[currentIndex];
if (acc.balance >= price) {
acc.balance -= price;
acc.receipts.unshift({ name: name, price: price });
playSound(980, "square", 0.12);
render();
} else {
playSound(190, "sawtooth", 0.25);
alert("Not enough money in the drawer!");
}
}
function render() {
var select = document.getElementById("accountSelect");
select.innerHTML = "";
for (var i = 0; i < accounts.length; i++) {
var opt = document.createElement("option");
opt.value = i;
opt.textContent = accounts[i].name;
if (i === currentIndex) opt.selected = true;
select.appendChild(opt);
}
var acc = accounts[currentIndex];
document.body.className = acc.theme === "pink" ? "" : "theme-" + acc.theme;
document.getElementById("balanceDisplay").textContent = "$" + acc.balance;
var billsBox = document.getElementById("billsContainer");
billsBox.innerHTML = "";
var rem = acc.balance;
var denoms =;
if (rem === 0) {
billsBox.textContent = "Drawer is empty";
} else {
for (var d = 0; d < denoms.length; d++) {
var val = denoms[d];
while (rem >= val) {
var bill = document.createElement("div");
bill.className = "paper-bill bill-" + val;
bill.textContent = "$" + val;
billsBox.appendChild(bill);
rem -= val;
}
}
}
var list = document.getElementById("receiptList");
list.innerHTML = "";
if (acc.receipts.length === 0) {
list.textContent = "No items bought yet";
} else {
for (var r = 0; r < acc.receipts.length; r++) {
var row = document.createElement("div");
row.className = "receipt-row";
row.innerHTML = "" + acc.receipts[r].name + "-$" + acc.receipts[r].price + "";
list.appendChild(row);
}
}
}
document.getElementById("accountSelect").addEventListener("change", function() {
currentIndex = Number(this.value);
document.getElementById("accountEditor").classList.remove("open");
playSound(520, "triangle", 0.12);
render();
});
document.getElementById("editBtn").addEventListener("click", function() { openEditor("edit"); });
document.getElementById("addBtn").addEventListener("click", function() { openEditor("add"); });
document.getElementById("themePink").addEventListener("click", function() { setTheme("pink"); });
document.getElementById("themeBlue").addEventListener("click", function() { setTheme("blue"); });
document.getElementById("themeOrange").addEventListener("click", function() { setTheme("orange"); });
document.getElementById("saveEditorBtn").addEventListener("click", saveEditor);
document.getElementById("cancelEditorBtn").addEventListener("click", function() {
document.getElementById("accountEditor").classList.remove("open");
});
document.getElementById("setCashBtn").addEventListener("click", function() {
var val = Math.floor(Number(document.getElementById("startCashInput").value));
if (document.getElementById("startCashInput").value !== "" && val >= 0) {
accounts[currentIndex].balance = val;
accounts[currentIndex].receipts = [];
playSound(700, "sine", 0.15);
render();
}
});
document.getElementById("resetBtn").addEventListener("click", function() {
accounts[currentIndex].balance = 0;
accounts[currentIndex].receipts = [];
document.getElementById("startCashInput").value = "";
playSound(260, "triangle", 0.18);
render();
});
document.getElementById("buyOjBtn").addEventListener("click", function() { buyItem("Orange Juice", 1); });
document.getElementById("buyBreadBtn").addEventListener("click", function() { buyItem("Bread", 2); });
document.getElementById("buyHouseBtn").addEventListener("click", function() { buyItem("House", 10); });
render();
