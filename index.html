<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kids Cash Register</title>
  <style>
    :root {
      --bg-grad: linear-gradient(135deg, #ffe6f2 0%, #f3e8ff 100%);
      --machine-bg: #fff5f9;
      --machine-border: #ff66b3;
      --machine-shadow: #d9368b;
      --header-bg: #ff85c0;
      --select-bg: #ffffff;
      --select-text: #c41d7f;
      --select-border: #eb2f96;
      --drawer-bg: #fffbe6;
      --drawer-border: #ffc53d;
      --drawer-inner: #fff1b8;
      --text-main: #531dab;
      --set-btn: #722ed1;
      --set-shadow: #391085;
      --house-grad: linear-gradient(180deg, #36cfc9 0%, #08979c 100%);
      --house-shadow: #00474f;
    }

    body.theme-blue {
      --bg-grad: linear-gradient(135deg, #e6f7ff 0%, #e6fffb 100%);
      --machine-bg: #f0f9ff;
      --machine-border: #36cfc9;
      --machine-shadow: #08979c;
      --header-bg: #40a9ff;
      --select-bg: #ffffff;
      --select-text: #0050b3;
      --select-border: #096dd9;
      --drawer-bg: #f6ffed;
      --drawer-border: #73d13d;
      --drawer-inner: #d9f7be;
      --text-main: #003a8c;
      --set-btn: #389e0d;
      --set-shadow: #135200;
      --house-grad: linear-gradient(180deg, #597ef7 0%, #1d39c4 100%);
      --house-shadow: #061178;
    }

    body.theme-orange {
      --bg-grad: linear-gradient(135deg, #fff7e6 0%, #fff1b8 100%);
      --machine-bg: #fffbe6;
      --machine-border: #ffa940;
      --machine-shadow: #d46b08;
      --header-bg: #fa8c16;
      --select-bg: #ffffff;
      --select-text: #ad4e00;
      --select-border: #d46b08;
      --drawer-bg: #f6ffed;
      --drawer-border: #95de64;
      --drawer-inner: #d9f7be;
      --text-main: #873800;
      --set-btn: #d4380d;
      --set-shadow: #871400;
      --house-grad: linear-gradient(180deg, #36cfc9 0%, #08979c 100%);
      --house-shadow: #00474f;
    }

    * {
      box-sizing: border-box;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-grad);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
      transition: all 0.3s ease;
    }

    .register-body {
      width: 100%;
      max-width: 640px;
      background: var(--machine-bg);
      border: 6px solid var(--machine-border);
      border-radius: 32px;
      padding: 22px;
      box-shadow: 0 14px 0 var(--machine-shadow), 0 20px 35px rgba(0,0,0,0.12);
    }

    .top-header {
      background: var(--header-bg);
      padding: 14px 18px;
      border-radius: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,0.12);
    }

    .profile-wrap {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    select {
      font-size: 1.3rem;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 16px;
      border: 4px solid var(--select-border);
      background: var(--select-bg);
      color: var(--select-text);
      cursor: pointer;
      outline: none;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    }

    .mini-btn {
      font-size: 0.95rem;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 14px;
      border: 3px solid #ffffff;
      background: rgba(0, 0, 0, 0.22);
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.08s;
    }

    .mini-btn:active {
      transform: translateY(2px);
    }

    .account-editor {
      display: none;
      background: #ffffff;
      border: 4px solid var(--machine-border);
      border-radius: 20px;
      padding: 14px;
      margin-bottom: 18px;
      box-shadow: 0 6px 0 rgba(0,0,0,0.08);
    }

    .account-editor.open {
      display: block;
    }

    .editor-title {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 10px;
    }

    .editor-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .editor-row input[type="text"] {
      flex: 1;
      min-width: 160px;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 9px 12px;
      border-radius: 12px;
      border: 3px solid #d9d9d9;
      outline: none;
    }

    .theme-choices {
      display: flex;
      gap: 8px;
    }

    .theme-pill {
      padding: 8px 14px;
      border-radius: 14px;
      border: 3px solid transparent;
      font-weight: bold;
      font-size: 1rem;
      color: #ffffff;
      cursor: pointer;
      opacity: 0.75;
    }

    .theme-pill.selected {
      opacity: 1;
      border-color: #262626;
      transform: scale(1.06);
    }

    .pill-pink { background: #eb2f96; }
    .pill-blue { background: #1890ff; }
    .pill-orange { background: #fa8c16; }

    .led-screen {
      background: #141414;
      border: 5px solid #434343;
      border-radius: 18px;
      padding: 8px 20px;
      text-align: right;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.8);
    }

    .led-caption {
      font-size: 0.75rem;
      color: #8c8c8c;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: monospace;
    }

    .led-amount {
      font-family: 'Courier New', monospace;
      font-size: 2.3rem;
      font-weight: bold;
      color: #52c41a;
      text-shadow: 0 0 10px rgba(82, 196, 26, 0.6);
      line-height: 1.1;
    }

    .money-input-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      background: #ffffff;
      padding: 10px;
      border-radius: 20px;
      border: 3px solid var(--machine-border);
    }

    input[type="number"] {
      flex: 1;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 10px 14px;
      border-radius: 14px;
      border: 3px solid #d9d9d9;
      color: #262626;
      outline: none;
      min-width: 0;
    }

    input[type="number"]:focus {
      border-color: var(--machine-border);
    }

    .action-btn {
      font-size: 1.05rem;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      padding: 10px 16px;
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.08s;
    }

    .action-btn:active {
      transform: translateY(4px);
    }

    .btn-set {
      background: var(--set-btn);
      box-shadow: 0 5px 0 var(--set-shadow);
    }

    .btn-reset {
      background: #ff4d4f;
      box-shadow: 0 5px 0 #a8071a;
    }

    .btn-cancel {
      background: #8c8c8c;
      box-shadow: 0 5px 0 #434343;
    }

    .store-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .item-btn {
      border: none;
      border-radius: 22px;
      padding: 16px 10px;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 125px;
      transition: transform 0.08s;
      text-shadow: 1px 2px 0 rgba(0,0,0,0.2);
    }

    .item-btn:active {
      transform: translateY(6px);
    }

    .btn-oj {
      background: linear-gradient(180deg, #ffa940 0%, #fa8c16 100%);
      box-shadow: 0 7px 0 #ad4e00;
    }

    .btn-bread {
      background: linear-gradient(180deg, #ffc53d 0%, #d48806 100%);
      box-shadow: 0 7px 0 #874d00;
    }

    .btn-house {
      background: var(--house-grad);
      box-shadow: 0 7px 0 var(--house-shadow);
    }

    .stacked-word {
      display: block;
      font-size: 1.45rem;
      font-weight: bold;
      line-height: 1.05;
    }

    .single-word {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .price-pill {
      margin-top: 8px;
      background: rgba(255, 255, 255, 0.28);
      padding: 3px 14px;
      border-radius: 999px;
      font-size: 1.15rem;
      font-weight: bold;
    }

    .cash-drawer {
      background: var(--drawer-bg);
      border: 5px solid var(--drawer-border);
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.08);
    }

    .drawer-header {
      font-size: 1.15rem;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .drawer-tray {
      background: var(--drawer-inner);
      border-radius: 16px;
      padding: 14px;
      min-height: 92px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      box-shadow: inset 0 3px 8px rgba(0,0,0,0.12);
    }

    .empty-msg {
      color: #8c8c8c;
      font-style: italic;
      font-size: 1.05rem;
    }

    .paper-bill {
      width: 124px;
      height: 60px;
      border-radius: 10px;
      border: 3px solid;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.4rem;
      box-shadow: 0 4px 0 rgba(0,0,0,0.18);
      user-select: none;
    }

    .paper-bill::before {
      content: "";
      position: absolute;
      inset: 4px;
      border: 2px dashed currentColor;
      border-radius: 6px;
      opacity: 0.45;
    }

    .bill-100 { background: #b7eb8f; border-color: #237804; color: #135200; }
    .bill-50  { background: #ffd6e7; border-color: #c41d7f; color: #780650; }
    .bill-20  { background: #bae7ff; border-color: #096dd9; color: #003a8c; }
    .bill-10  { background: #ffe7ba; border-color: #d46b08; color: #873800; }
    .bill-5   { background: #efdbff; border-color: #531dab; color: #22075e; }
    .bill-1   { background: #d9f7be; border-color: #389e0d; color: #135200; }

    .receipt-box {
      background: #ffffff;
      border: 4px dashed #bfbfbf;
      border-radius: 20px;
      padding: 16px;
    }

    .receipt-title {
      font-size: 1.15rem;
      font-weight: bold;
